<!doctype html>
<!-- TvCast low-latency receiver. Signaling flow adapted from ddagunts/ScreenCast (Apache-2.0), see NOTICE-WEBRTC.md.
     Host this file over HTTPS and register its URL for the Cast App ID in the Google Cast SDK Developer Console. -->
<html>
<head>
<meta charset="utf-8">
<title>TvCast receiver</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;font-family:sans-serif}
  video{width:100vw;height:100vh;object-fit:contain;background:#000}
  #s{position:fixed;left:12px;bottom:10px;font-size:13px;opacity:.6}
  #s.h{display:none}
</style>
</head>
<body>
<video id="v" autoplay playsinline></video>
<div id="s">TvCast receiver starting…</div>
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script src="//www.gstatic.com/cast/sdk/libs/devtools/debug_layer/caf_receiver_logger.js"></script>
<script>
var NS = 'urn:x-cast:com.tvcast.universalremote.webrtc';
var video = document.getElementById('v');
var st = document.getElementById('s');
function status(t) { st.textContent = t; }
window.addEventListener('error', function (e) { status('JS: ' + e.message); });
window.addEventListener('unhandledrejection', function (e) { status('JS promise: ' + (e.reason && e.reason.message || e.reason)); });

var context = cast.framework.CastReceiverContext.getInstance();
var options = new cast.framework.CastReceiverOptions();
options.disableIdleTimeout = true;           // we never use CAF media, so CAF would think we are idle
options.maxInactivity = 24 * 60 * 60;
options.skipPlayersLoad = true;              // no media players needed: lighter page, less memory on the TV
options.customNamespaces = {};
options.customNamespaces[NS] = cast.framework.system.MessageType.JSON;

var senderId = null, pc = null;
function send(o) { try { context.sendCustomMessage(NS, senderId, o); } catch (e) {} }
function closePeer() { if (pc) { try { pc.close(); } catch (e) {} pc = null; } }

function makePeer() {
  var p = new RTCPeerConnection({ iceServers: [] });
  var stream = new MediaStream();
  video.srcObject = stream;
  p.ontrack = function (e) {
    stream.addTrack(e.track);
    // Lowest playout delay the browser allows (ignored where unsupported).
    try { if ('playoutDelayHint' in e.receiver) e.receiver.playoutDelayHint = 0; } catch (x) {}
    try { if ('jitterBufferTarget' in e.receiver) e.receiver.jitterBufferTarget = 0; } catch (x) {}
    var pr = video.play(); if (pr && pr.catch) pr.catch(function (x) { status('play failed: ' + x); });
  };
  p.onicecandidate = function (e) {
    if (e.candidate) send({ type: 'ICE', candidate: { candidate: e.candidate.candidate, sdpMid: e.candidate.sdpMid, sdpMLineIndex: e.candidate.sdpMLineIndex } });
  };
  p.onconnectionstatechange = function () {
    if (p.connectionState === 'connected') st.className = 'h';
    else { st.className = ''; status('connection: ' + p.connectionState); }
  };
  return p;
}

context.addCustomMessageListener(NS, function (evt) {
  senderId = evt.senderId || senderId;
  var m = evt.data;
  if (!m || typeof m !== 'object') return;
  if (m.type === 'OFFER') {
    closePeer(); pc = makePeer();
    pc.setRemoteDescription({ type: 'offer', sdp: m.sdp })
      .then(function () { return pc.createAnswer(); })
      .then(function (a) { return pc.setLocalDescription(a).then(function () { send({ type: 'ANSWER', sdp: a.sdp }); }); })
      .catch(function (err) { status('offer failed: ' + err); });
  } else if (m.type === 'ICE' && m.candidate && m.candidate.candidate && pc) {
    pc.addIceCandidate({ candidate: m.candidate.candidate, sdpMid: m.candidate.sdpMid, sdpMLineIndex: m.candidate.sdpMLineIndex }).catch(function () {});
  } else if (m.type === 'BYE') {
    status('ended'); st.className = ''; closePeer();
  }
});

context.start(options);
status('ready v2');
send({ type: 'READY' });

// ---- Diagnostics: everything below reports to the phone (shows in logcat as "webrtc <- ... LOG/STATS") ----
function log(msg) { send({ type: 'LOG', msg: String(msg) }); }
window.addEventListener('error', function (e) { log('JS error: ' + e.message + ' @' + e.lineno); });
window.addEventListener('unhandledrejection', function (e) { log('promise: ' + (e.reason && e.reason.message || e.reason)); });
['error', 'stalled', 'waiting', 'emptied', 'abort'].forEach(function (n) {
  video.addEventListener(n, function () { log('video ' + n + (video.error ? ' code=' + video.error.code + ' ' + (video.error.message || '') : '')); });
});
try {
  var ET = cast.framework.system.EventType;
  context.addEventListener(ET.SENDER_DISCONNECTED, function (e) { log('SENDER_DISCONNECTED reason=' + e.reason); });
  context.addEventListener(ET.SHUTDOWN, function () { log('SHUTDOWN'); });
  context.addEventListener(ET.ERROR, function (e) { log('CAF ERROR ' + JSON.stringify(e)); });
} catch (x) { log('event hookup failed: ' + x); }
try { if (cast.debug && cast.debug.CastDebugLogger) { var dl = cast.debug.CastDebugLogger.getInstance(); dl.setEnabled(true); dl.showDebugLogs(true); } } catch (x) {}

setInterval(function () {
  if (!pc) return;
  pc.getStats().then(function (rep) {
    var o = { type: 'STATS' };
    rep.forEach(function (r) {
      if (r.type === 'inbound-rtp' && r.kind === 'video') {
        o.recv = r.framesReceived; o.dec = r.framesDecoded; o.drop = r.framesDropped; o.lost = r.packetsLost;
        o.kbps = Math.round((r.bytesReceived || 0) / 1024); o.fps = r.framesPerSecond; o.w = r.frameWidth; o.h = r.frameHeight;
        o.impl = r.decoderImplementation; o.freeze = r.freezeCount; o.key = r.keyFramesDecoded; o.pli = r.pliCount;
        if (r.jitterBufferDelay && r.jitterBufferEmittedCount) o.jbMs = Math.round(r.jitterBufferDelay / r.jitterBufferEmittedCount * 1000);
      }
    });
    try { if (performance.memory) { o.heapMB = Math.round(performance.memory.usedJSHeapSize / 1048576); o.heapMax = Math.round(performance.memory.jsHeapSizeLimit / 1048576); } } catch (x) {}
    o.ready = video.readyState; o.t = Math.round(video.currentTime * 10) / 10;
    send(o);
  }).catch(function () {});
}, 1000);
</script>
</body>
</html>
